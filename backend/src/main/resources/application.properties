# =============================================================================
# CONFIGURACIÓN BASE (común a todos los perfiles)
# =============================================================================

# Servidor
server.port=8080
spring.profiles.active=postgres

# Aplicación
app.version=@project.version@

# JPA/Hibernate
spring.jpa.show-sql=false

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT (requiere variable de entorno JWT_SECRET)
jwt.secret=${JWT_SECRET}

# Rate Limiting
rate-limit.max-attempts=5
rate-limit.refill-minutes=1

# Logging estructurado (formato JSON compatible con Logstash/ELK)
#logging.structured.format.console=logstash