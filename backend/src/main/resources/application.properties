# Puerto del servidor
server.port=8080

# Perfil activo
spring.profiles.active=postgres

# JPA/Hibernate
spring.jpa.show-sql=true
# Serializar fechas como ISO 8601 en lugar de arrays
spring.jackson.serialization.write-dates-as-timestamps=false
# Versión de la aplicación (inyectada desde pom.xml por Maven)
app.version=@project.version@

# Rate Limiting Configuration
# Máximo de intentos de login permitidos por IP
rate-limit.max-attempts=5
# Tiempo en minutos para recargar los intentos
rate-limit.refill-minutes=1

# Logging estructurado (formato JSON compatible con Logstash/ELK)
logging.structured.format.console=logstash