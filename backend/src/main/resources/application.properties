# =============================================================================
# CONFIGURACIÓN BASE (común a todos los perfiles)
# =============================================================================

# Servidor
server.port=8080
spring.profiles.active=postgres

# Aplicación
app.version=@project.version@

# JPA/Hibernate
spring.jpa.show-sql=false

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT (requiere variable de entorno JWT_SECRET)
jwt.secret=${JWT_SECRET}

# Rate Limiting
rate-limit.max-attempts=5
rate-limit.refill-minutes=1

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.info.env.enabled=true
info.app.name=SpringReact Backend
info.app.version=@project.version@

# Logging estructurado (formato JSON compatible con Logstash/ELK)
#logging.structured.format.console=logstash